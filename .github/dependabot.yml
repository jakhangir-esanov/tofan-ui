version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      angular:
        applies-to: version-updates
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular', 'angular-eslint']
      angular-security:
        applies-to: security-updates
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular', 'angular-eslint']
      optimus:
        patterns: ['@openng/*']
      tooling:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
          - vitest
          - jsdom
          - prettier
          - tailwindcss
          - '@tailwindcss/*'
          - postcss
          - '@softarc/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
