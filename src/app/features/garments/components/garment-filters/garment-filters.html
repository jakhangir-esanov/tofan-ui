<div class="mb-4 grid grid-cols-1 items-start gap-3 sm:grid-cols-2 lg:grid-cols-4">
  <div class="flex flex-col gap-1">
    <label for="filterSerialNumber" class="text-muted-color text-sm">{{
      'garments.filters.serialNumber' | t
    }}</label>
    <input
      pInputText
      id="filterSerialNumber"
      type="search"
      [formField]="form.serialNumber"
      placeholder="01K7"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="filterDrop" class="text-muted-color text-sm">{{
      'garments.filters.drop' | t
    }}</label>
    <app-select-field
      inputId="filterDrop"
      [formField]="form.dropId"
      [options]="dropOptions()"
      [placeholder]="'garments.filters.all' | t"
      [showClear]="true"
      [fluid]="true"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="filterVariant" class="text-muted-color text-sm">{{
      'garments.filters.variant' | t
    }}</label>
    <app-select-field
      inputId="filterVariant"
      [formField]="form.variantId"
      [options]="variantOptions()"
      [placeholder]="'garments.filters.all' | t"
      [showClear]="true"
      [fluid]="true"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="filterSize" class="text-muted-color text-sm">{{
      'garments.filters.size' | t
    }}</label>
    <app-select-field
      inputId="filterSize"
      [formField]="form.size"
      [options]="sizeOptions"
      [placeholder]="'garments.filters.all' | t"
      [showClear]="true"
      [fluid]="true"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="filterStatus" class="text-muted-color text-sm">{{
      'garments.filters.status' | t
    }}</label>
    <app-select-field
      inputId="filterStatus"
      [formField]="form.status"
      [options]="statusOptions()"
      [placeholder]="'garments.filters.all' | t"
      [showClear]="true"
      [fluid]="true"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="filterClaim" class="text-muted-color text-sm">{{
      'garments.filters.owner' | t
    }}</label>
    <app-select-field
      inputId="filterClaim"
      [formField]="form.claim"
      [options]="claimOptions()"
      [placeholder]="'garments.filters.all' | t"
      [showClear]="true"
      [fluid]="true"
    />
  </div>

  <div class="flex flex-col gap-1">
    <span class="text-muted-color text-sm">{{ 'garments.filters.edition' | t }}</span>
    <div class="flex items-center gap-2">
      <app-number-field
        inputId="filterEditionFrom"
        [formField]="form.editionFrom"
        [useGrouping]="false"
        [placeholder]="'garments.filters.from' | t"
        [fluid]="true"
      />
      <span class="text-muted-color">–</span>
      <app-number-field
        inputId="filterEditionTo"
        [formField]="form.editionTo"
        [useGrouping]="false"
        [placeholder]="'garments.filters.to' | t"
        [fluid]="true"
      />
    </div>
  </div>

  <div class="flex flex-col gap-1">
    <label for="filterOwnerId" class="text-muted-color text-sm">{{
      'garments.filters.ownerId' | t
    }}</label>
    <input
      pInputText
      id="filterOwnerId"
      type="search"
      [formField]="form.ownerId"
      placeholder="UUID"
    />
    @if (ownerIdInvalid()) {
      <small class="text-red-500">{{ 'garments.filters.ownerIdInvalid' | t }}</small>
    }
  </div>

  <p-button
    class="self-end sm:col-span-2 lg:col-span-4 lg:justify-self-end"
    [label]="'common.actions.clear' | t"
    icon="pi pi-filter-slash"
    severity="secondary"
    [text]="true"
    (onClick)="reset()"
  />
</div>
