@if (variants().length === 0) {
  <p class="text-muted-color m-0 text-sm">{{ 'garments.form.noVariants' | t }}</p>
} @else {
  <div
    class="grid grid-cols-2 gap-3 sm:grid-cols-4"
    role="radiogroup"
    [attr.aria-labelledby]="ariaLabelledBy()"
  >
    @for (variant of variants(); track variant.id) {
      @let selected = variant.id === value();
      <button
        type="button"
        role="radio"
        class="border-surface-200 dark:border-surface-700 flex cursor-pointer flex-col overflow-hidden rounded-lg border text-left"
        [class.border-primary]="selected"
        [class.ring-2]="selected"
        [class.ring-primary]="selected"
        [class.border-red-500]="invalid() && touched() && !selected"
        [attr.aria-checked]="selected"
        [disabled]="disabled()"
        (click)="choose(variant)"
      >
        @if (variant.imageUrl; as imageUrl) {
          <img [src]="imageUrl" [alt]="variant.name" class="aspect-square w-full object-cover" />
        } @else {
          <span class="aspect-square w-full" [style.background-color]="variant.color"></span>
        }
        <span class="flex items-center gap-1.5 px-2 py-1.5 text-sm">
          <span
            class="border-surface-300 size-3 shrink-0 rounded-full border"
            [style.background-color]="variant.color"
            aria-hidden="true"
          ></span>
          <span class="truncate">{{ variant.name }}</span>
        </span>
      </button>
    }
  </div>
}
