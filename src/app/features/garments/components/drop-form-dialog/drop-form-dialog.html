<app-form-dialog
  [(visible)]="visible"
  [header]="'garments.drops.form.header' | t"
  [saveLabel]="'garments.drops.form.save' | t"
  [saving]="saving()"
  (save)="submit()"
>
  <div class="flex flex-col gap-5">
    <div class="flex flex-col gap-2">
      <label for="dropName" class="font-medium">{{ 'garments.drops.form.name' | t }}</label>
      <app-text-field
        inputId="dropName"
        autocomplete="off"
        [formField]="form.name"
        [placeholder]="'garments.drops.form.namePlaceholder' | t"
      />
      <app-field-error [field]="form.name()" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="dropTotalQuantity" class="font-medium">{{
        'garments.drops.form.totalQuantity' | t
      }}</label>
      <app-number-field
        inputId="dropTotalQuantity"
        [formField]="form.totalQuantity"
        [useGrouping]="false"
        [fluid]="true"
      />
      <small class="text-muted-color">{{ 'garments.drops.form.totalQuantityHint' | t }}</small>
      <app-field-error [field]="form.totalQuantity()" />
    </div>
  </div>
</app-form-dialog>
