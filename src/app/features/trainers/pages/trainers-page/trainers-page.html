<div class="card">
  <h1 class="text-surface-900 dark:text-surface-0 m-0 mb-4 text-xl font-semibold">
    {{ 'trainers.page.title' | t }}
  </h1>

  <p-tabs [value]="activeTab()">
    <p-tablist>
      @for (tab of tabs; track tab.value) {
        <p-tab [value]="tab.value" [routerLink]="tab.path">
          <i [class]="tab.icon" aria-hidden="true"></i>
          <span>{{ tab.label | t }}</span>
        </p-tab>
      }
    </p-tablist>
  </p-tabs>

  <div class="pt-4">
    <router-outlet />
  </div>
</div>
