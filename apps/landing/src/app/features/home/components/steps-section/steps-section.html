<section class="section">
  <div class="container content">
    <landing-section-heading title="steps.title" />
    <ol class="steps">
      @for (step of steps; track step.title; let number = $index) {
        <li class="step reveal" [style.--i]="number">
          <span class="display number" aria-hidden="true">{{ number + 1 }}</span>
          <h3 class="step-title">{{ step.title | t }}</h3>
          <p class="step-text">{{ step.text | t }}</p>
        </li>
      }
    </ol>
  </div>
</section>
