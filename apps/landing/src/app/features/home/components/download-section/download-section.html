<section class="download" [id]="sectionId">
  <div class="container layout">
    <div class="copy">
      <h2 class="display title">{{ 'download.title' | t }}</h2>
      <p class="text reveal">{{ 'download.text' | t }}</p>
      <landing-store-badges class="reveal" tone="dark" [style.--i]="1" />
    </div>
    <figure class="qr reveal" [style.--i]="2">
      <img [src]="qrImage" width="160" height="160" [alt]="'download.qr' | t" />
      <figcaption>{{ 'download.qr' | t }}</figcaption>
    </figure>
  </div>
</section>
